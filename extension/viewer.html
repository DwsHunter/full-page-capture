<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Capture</title>
  <link rel="icon" href="icons/32.png">
  <style>
    :root { --bg:#0b1220; --panel:#111a2e; --line:#23304a; --text:#e5e9f2; --muted:#93a0b8; --accent:#3b82f6; --ok:#22c55e; --err:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { position:sticky; top:0; z-index:2; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center;
             padding:12px 20px; background:var(--panel); border-bottom:1px solid var(--line); }
    h1 { font-size:15px; font-weight:600; margin:0; flex:1 1 280px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .meta { color:var(--muted); font-size:12px; font-weight:400; margin-left:8px; }
    .actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    button, select { font:inherit; color:var(--text); background:#1a2540; border:1px solid var(--line); border-radius:7px; padding:6px 12px; cursor:pointer; }
    button:hover { border-color:#3a4b70; }
    button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
    button:disabled { opacity:.55; cursor:progress; }
    #status { font-size:12px; color:var(--muted); min-width:160px; }
    #status.ok { color:var(--ok); } #status.err { color:var(--err); }
    main { padding:20px; display:flex; justify-content:center; }
    img { max-width:100%; height:auto; display:block; border:1px solid var(--line); border-radius:4px; box-shadow:0 8px 30px rgba(0,0,0,.35); }
    .empty { color:var(--muted); padding:60px 20px; text-align:center; }
  </style>
</head>
<body>
  <header>
    <h1 id="title">Loading…</h1>
    <div class="actions">
      <select id="layout" title="PDF page layout">
        <option value="continuous">One continuous page</option>
        <option value="a4-landscape">A4 landscape pages</option>
        <option value="a4-portrait">A4 portrait pages</option>
      </select>
      <button id="pdf" class="primary">Save PDF</button>
      <button id="png">Save PNG</button>
      <button id="copy">Copy image</button>
      <span id="status"></span>
    </div>
  </header>
  <main id="main"></main>
  <script type="module" src="viewer.js"></script>
</body>
</html>

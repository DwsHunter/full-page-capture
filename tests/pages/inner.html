<!doctype html><html><head><meta charset=utf-8><style>
html,body{margin:0;height:100%;overflow:hidden;background:#101010}

#enc{display:block;width:800px;height:5000px}
.lazy{height:400px;background:#444}
#foot{height:37px;background:#123456}

<div id=app>

  <div id=sticky></div>

    <canvas id=enc></canvas><div class=lazy></div><div id=foot></div>
  </main>
</div>
